name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create checksum
        run: sha256sum install-ssh-key.ps1 install-ssh-key.sh > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          install-ssh-key.ps1
          install-ssh-key.sh
          SHA256SUMS.txt
          --generate-notes
          --title "SSH Key Installer $GITHUB_REF_NAME"

