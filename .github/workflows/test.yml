name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repository checks
        shell: powershell
        run: .\tests\Test-Repository.ps1

  posix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check POSIX syntax (dash)
        run: dash -n install-ssh-key.sh
      - name: Run POSIX repository checks
        run: sh tests/Test-Repository.sh
